---
- name: Configure Jenkins build agent
  hosts: jenkins_controller
  become: true

  tasks:
    - name: Create Jenkins init directory
      ansible.builtin.file:
        path: /var/lib/jenkins/init.groovy.d
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0755"

    - name: Install Jenkins agent configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/jenkins-agent-init.groovy.j2"
        dest: /var/lib/jenkins/init.groovy.d/20-i27-agent.groovy
        owner: jenkins
        group: jenkins
        mode: "0600"
      register: jenkins_agent_config

    - name: Restart Jenkins when agent configuration changes
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
      when: jenkins_agent_config.changed

    - name: Wait for Jenkins
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8080
        delay: 5
        timeout: 120

    - name: Verify Jenkins service
      ansible.builtin.command:
        cmd: systemctl is-active jenkins
      register: jenkins_service
      changed_when: false

    - name: Display Jenkins service state
      ansible.builtin.debug:
        var: jenkins_service.stdout
